[package]
name = "pringle-wallet"
version = "0.1.0"
edition = "2021"
description = "A simple mainnet Chia CLI for keys, NFTs, p2_singleton funding, and NFT-backed options."
license = "MIT"

[lib]
name = "pringle_wallet"
path = "src/lib.rs"

[[bin]]
name = "pringle"
path = "src/main.rs"

[dependencies]
chia-wallet-sdk = { version = "0.34.0", features = ["rustls", "offer-compression"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.9"
indexmap = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
anyhow = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
